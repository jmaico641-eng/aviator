<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Predictor - Próximo Voo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            font-size: 2em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-bar {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
        }

        .status-item {
            text-align: center;
        }

        .status-item .value {
            font-size: 1.5em;
            font-weight: bold;
            color: #00d4ff;
        }

        .prediction-box {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 3px solid #7b2ff7;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .prediction-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(123,47,247,0.1) 0%, transparent 70%);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .prediction-label {
            font-size: 1.2em;
            opacity: 0.7;
            margin-bottom: 10px;
            position: relative;
        }

        .prediction-value {
            font-size: 5em;
            font-weight: bold;
            position: relative;
            text-shadow: 0 0 30px rgba(0,212,255,0.5);
        }

        .prediction-value.loading {
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .confidence-bar {
            margin-top: 20px;
            position: relative;
        }

        .confidence-label {
            font-size: 1em;
            margin-bottom: 10px;
        }

        .confidence-track {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 1s ease, background 1s ease;
        }

        .confidence-fill.high {
            background: linear-gradient(90deg, #00b894, #00cec9);
        }

        .confidence-fill.medium {
            background: linear-gradient(90deg, #fdcb6e, #e17055);
        }

        .confidence-fill.low {
            background: linear-gradient(90deg, #e17055, #d63031);
        }

        .recommendation {
            margin-top: 20px;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1.5em;
            font-weight: bold;
            position: relative;
        }

        .recommendation.bet {
            background: linear-gradient(90deg, #00b894, #00cec9);
            color: #000;
            animation: glow 2s ease-in-out infinite;
        }

        .recommendation.wait {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(0,184,148,0.5); }
            50% { box-shadow: 0 0 40px rgba(0,184,148,0.8); }
        }

        .history-box {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
        }

        .history-title {
            font-size: 1.1em;
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            margin-bottom: 5px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            font-size: 0.9em;
        }

        .history-item.correct {
            border-left: 3px solid #00b894;
        }

        .history-item.wrong {
            border-left: 3px solid #d63031;
        }

        .update-time {
            text-align: center;
            margin-top: 15px;
            font-size: 0.85em;
            opacity: 0.5;
        }

        .plane-icon {
            font-size: 3em;
            margin-bottom: 20px;
            position: relative;
            animation: fly 2s ease-in-out infinite;
        }

        @keyframes fly {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 AVIATOR PREDICTOR</h1>
        <p style="text-align:center; opacity:0.7; margin-bottom:20px;">Próximo Voo - Previsão em Tempo Real</p>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item">
                <div class="value" id="roundsCollected">0</div>
                <div>Rodadas</div>
            </div>
            <div class="status-item">
                <div class="value" id="seedsCollected">0</div>
                <div>Seeds</div>
            </div>
            <div class="status-item">
                <div class="value" id="accuracy">--%</div>
                <div>Acurácia</div>
            </div>
        </div>

        <!-- Prediction Box -->
        <div class="prediction-box">
            <div class="plane-icon">✈️</div>
            <div class="prediction-label">PRÓXIMO VOO</div>
            <div class="prediction-value loading" id="predictionValue">--</div>
            
            <div class="confidence-bar">
                <div class="confidence-label">Confiança: <span id="confidenceText">Calculando...</span></div>
                <div class="confidence-track">
                    <div class="confidence-fill low" id="confidenceBar" style="width: 0%"></div>
                </div>
            </div>

            <div class="recommendation wait" id="recommendation">
                AGUARDANDO DADOS
            </div>
        </div>

        <!-- History -->
        <div class="history-box">
            <div class="history-title">📊 Últimas Previsões</div>
            <div id="historyList">
                <div style="text-align:center; opacity:0.5; padding:20px;">
                    Nenhuma previsão ainda...
                </div>
            </div>
        </div>

        <div class="update-time">
            Última atualização: <span id="lastUpdate">--</span>
        </div>
    </div>

    <script>
        const socket = io();
        const history = [];

        socket.on('prediction', (data) => {
            updatePrediction(data);
        });

        socket.on('newMultiplier', (data) => {
            addToHistory(data);
        });

        socket.on('stats', (data) => {
            updateStats(data);
        });

        function updatePrediction(data) {
            // Valor previsto
            const predEl = document.getElementById('predictionValue');
            if (data.predicted !== null && data.predicted !== undefined) {
                predEl.textContent = data.predicted.toFixed(2) + 'x';
                predEl.classList.remove('loading');
            } else {
                predEl.textContent = '--';
                predEl.classList.add('loading');
            }

            // Confiança
            const conf = data.confidence || 0;
            const confPercent = (conf * 100).toFixed(0);
            document.getElementById('confidenceText').textContent = confPercent + '%';
            
            const bar = document.getElementById('confidenceBar');
            bar.style.width = confPercent + '%';
            bar.className = 'confidence-fill ' + (conf >= 0.7 ? 'high' : conf >= 0.4 ? 'medium' : 'low');

            // Recomendação
            const recEl = document.getElementById('recommendation');
            const rec = data.recommendation || 'AGUARDAR';
            recEl.textContent = rec;
            recEl.className = 'recommendation ' + (rec.includes('APOSTAR') ? 'bet' : 'wait');
        }

        function addToHistory(data) {
            history.unshift(data);
            if (history.length > 10) history.pop();

            const listEl = document.getElementById('historyList');
            listEl.innerHTML = '';

            history.forEach(item => {
                const el = document.createElement('div');
                el.className = 'history-item';
                const accuracy = item.accuracy || 0;
                el.classList.add(accuracy > 0.7 ? 'correct' : 'wrong');
                el.innerHTML = `
                    <span>${item.predicted ? item.predicted.toFixed(2) + 'x' : '--'}</span>
                    <span>Real: ${item.actual ? item.actual.toFixed(2) + 'x' : '--'}</span>
                    <span>${(accuracy * 100).toFixed(0)}%</span>
                `;
                listEl.appendChild(el);
            });
        }

        function updateStats(data) {
            if (data.statistics) {
                document.getElementById('roundsCollected').textContent = data.statistics.rounds || 0;
            }
            if (data.seeds) {
                document.getElementById('seedsCollected').textContent = data.seeds;
            }
            if (data.accuracy) {
                document.getElementById('accuracy').textContent = (data.accuracy.last10 * 100).toFixed(0) + '%';
            }

            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
        }

        // Simulação inicial (até conectar ao socket real)
        setTimeout(() => {
            updatePrediction({
                predicted: null,
                confidence: 0,
                recommendation: 'COLETANDO DADOS...'
            });
        }, 1000);
    </script>
    <script src="/socket.io/socket.io.js"></script>
</body>
</html>
